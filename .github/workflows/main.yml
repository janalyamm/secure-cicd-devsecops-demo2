name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Security Scan
        id: security_scan
        run: npm run audit:ci

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Build Docker Image
        run: docker build -t secure-cicd-demo .

      - name: Run Docker Container
        run: docker run -d --name secure-cicd-demo -p 3000:3000 secure-cicd-demo

      - name: Verify Docker Health Check
        run: |
          for i in {1..10}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' secure-cicd-demo)
            echo "Health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done

          docker logs secure-cicd-demo
          exit 1

      - name: Stop Docker Container
        if: always()
        run: docker rm -f secure-cicd-demo || true

      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notify."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" -d '{
            "content": "Pipeline failed in secure-cicd-devsecops-demo2",
            "embeds": [{
              "title": "Security / CI failure",
              "description": "Check GitHub Actions. Common cause: npm audit found high or critical vulnerabilities.",
              "color": 15158332
            }]
          }' "$DISCORD_WEBHOOK_URL"

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set; skipping Telegram notify."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TEXT=$(cat <<EOF
          <b>Pipeline Failure</b>

          <b>Repo:</b> ${GITHUB_REPOSITORY}
          <b>Branch:</b> ${GITHUB_REF_NAME}
          <b>Workflow:</b> ${GITHUB_WORKFLOW}
          <b>Trigger:</b> ${GITHUB_EVENT_NAME}
          <b>Commit:</b> ${SHORT_SHA}
          <b>Actor:</b> ${GITHUB_ACTOR}

          <b>Cause:</b> a CI step failed (often: npm audit found high/critical vulnerability).

          <a href="${RUN_URL}">View workflow run →</a>
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: ($chat|tonumber), text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
