name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Security Scan
        id: security_scan
        run: npm run audit:ci

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Build Docker Image
        run: docker build -t secure-cicd-demo .

      - name: Run Docker Container
        run: docker run -d --name secure-cicd-demo -p 3000:3000 secure-cicd-demo

      - name: Verify Docker Health Check
        run: |
          for i in {1..10}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' secure-cicd-demo)
            echo "Health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done

          docker logs secure-cicd-demo
          exit 1

      - name: Stop Docker Container
        if: always()
        run: docker rm -f secure-cicd-demo || true

      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notify."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" -d '{
            "content": "Pipeline failed in secure-cicd-devsecops-demo2",
            "embeds": [{
              "title": "Security / CI failure",
              "description": "Check GitHub Actions. Common cause: npm audit found high or critical vulnerabilities.",
              "color": 15158332
            }]
          }' "$DISCORD_WEBHOOK_URL"
