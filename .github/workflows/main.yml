name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Security Scan
        id: security_scan
        run: npm run audit:ci

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notify."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" -d '{
            "content": "Pipeline failed in secure-cicd-devsecops-demo2",
            "embeds": [{
              "title": "Security / CI failure",
              "description": "Check GitHub Actions. Common cause: npm audit found high or critical vulnerabilities.",
              "color": 15158332
            }]
          }' "$DISCORD_WEBHOOK_URL"
